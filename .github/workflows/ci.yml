name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "0.15.4"
          spago: "1.0.5"
      - run: npm install
      - run: npm run -s build
      - run: npm run -s test
